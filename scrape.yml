name: Revita Temu Export

on:
  workflow_dispatch:
    inputs:
      limit:
        description: '0 = all products; positive number = trial run'
        default: '0'
        type: string
      offline:
        description: 'Offline test using supplied HTML only'
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: revita-temu-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test against supplied HTML
        run: python -m unittest discover -s tests -v
      - name: Export products
        env:
          PRODUCT_LIMIT: ${{ inputs.limit }}
          OFFLINE: ${{ inputs.offline }}
        run: |
          args=(--limit "$PRODUCT_LIMIT" --refresh)
          if [ "$OFFLINE" = "true" ]; then args+=(--offline); fi
          python revita.py "${args[@]}"
      - name: Downloadable result files and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revita-temu-results
          path: output/
          if-no-files-found: warn
          retention-days: 30
