name: Revita Temu All Three Brands

on:
  workflow_dispatch:
    inputs:
      limit:
        description: '0 = all products; positive number = trial run'
        default: '0'
        type: string

permissions:
  contents: read

concurrency:
  group: revita-temu-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install required label OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-bul
      - name: Test parser and export policies
        run: python -m unittest discover -s tests -v
      - name: Export products
        env:
          PRODUCT_LIMIT: ${{ inputs.limit }}
        run: |
          python revita.py --limit "$PRODUCT_LIMIT" --refresh
      - name: Downloadable result files and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revita-temu-all-brands-results
          path: output/
          if-no-files-found: warn
          retention-days: 30
